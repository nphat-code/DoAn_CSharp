name: TuneVault CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-backend:
    name: Build .NET Backend
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Cập nhật theo phiên bản bạn đang dùng
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --no-restore --configuration Release
      
    # Bật phần này lên nếu bạn có viết Unit Test sau này
    # - name: Test
    #   run: dotnet test --no-build --verbosity normal --configuration Release

  build-frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./tunevault-client

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./tunevault-client/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build
